<!DOCTYPE html>
<html lang="en">
<head>

  <title>Heart Direction World</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="scrolly">

    <!-- Section 1: heart-director-2 (Figma node 1098:2), illustrated hero intro -->

      <img class="hd2-bg-fullscreen" src="assets/images/heart-director-2/bg-blue.webp" alt="" />
      <div class="hero-section hero-illustrated">
        <h1 class="visually-hidden">
          Introducing Laindoe Love — The Heart Director. Revealing the invisible.
        </h1>

        <img class="hd2-bg" src="assets/images/heart-director-2/bg-blue.webp" alt="" />
        <img class="hd2-clouds-left" src="assets/images/heart-director-2/clouds-left.webp" alt="" />
        <img class="hd2-clouds-right" src="assets/images/heart-director-2/clouds-right.webp" alt="" />
        <img class="hd2-border" src="assets/images/heart-director-2/border.webp" alt="" />
        <img class="hd2-tunnel" src="assets/images/heart-director-2/heart-tunnel.webp" alt="" />
        <img class="hd2-title" src="assets/images/heart-director-2/title.webp" alt="" />
        <img class="hd2-ribbon-introducing" src="assets/images/heart-director-2/ribbon-introducing.webp" alt="" />
        <img class="hd2-ribbon-revealing" src="assets/images/heart-director-2/ribbon-revealing.webp" alt="" />
        <img class="hd2-cherub-left" src="assets/images/heart-director-2/cherub.webp" alt="" />
        <img class="hd2-cherub-right" src="assets/images/heart-director-2/cherub.webp" alt="" />
        <img class="hd2-sacred-heart" src="assets/images/heart-director-2/sacred-heart.webp" alt="" />
        <img class="hd2-star hd2-star-1" src="assets/images/heart-director-2/star.webp" alt="" />
        <img class="hd2-star hd2-star-2" src="assets/images/heart-director-2/star.webp" alt="" />
        <img class="hd2-star hd2-star-3" src="assets/images/heart-director-2/star.webp" alt="" />

        <button type="button" class="hd2-marquee-btn">
          <img class="hd2-marquee-bg" src="assets/images/heart-director-2/marquee-board.webp" alt="" />
          <span class="hd2-marquee-label">Enter the Tunnel</span>
        </button>
      </div>
    </section>

    <!-- Next sections (section-2, section-3, ...) get appended here as they're designed in Figma -->

  </main>

  <script src="script.js"></script>

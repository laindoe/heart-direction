<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Direction World</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="scrolly">

    <!-- Section 1: heart-director (Figma node 1084:2), hero intro -->
    <section id="section-1" class="hero-section">
      <h1 class="visually-hidden">
        Introducing Lain Doe Love — The Heart Director. Exploring how the invisible becomes reality.
      </h1>

      <img class="hd-bg" src="assets/images/heart-director/bg-starfield.jpg" alt="" />
      <img class="hd-title-heart" src="assets/images/heart-director/title-heart.webp" alt="" />
      <img class="hd-title-director" src="assets/images/heart-director/title-director.webp" alt="" />
      <img class="hd-title-the" src="assets/images/heart-director/title-the.webp" alt="" />
      <img class="hd-label-introducing" src="assets/images/heart-director/label-introducing.png" alt="" />
      <img class="hd-portrait-halo" src="assets/images/heart-director/portrait-halo.jpg" alt="" />
      <img class="hd-label-laindoelove" src="assets/images/heart-director/label-laindoelove.png" alt="" />
      <img class="hd-portrait-photo" src="assets/images/heart-director/portrait-photo.webp" alt="Lain Doe Love standing before a heart-shaped tunnel of lights" />
      <img class="hd-subtitle" src="assets/images/heart-director/subtitle-exploring.png" alt="" />
      <img class="hd-angel-left" src="assets/images/heart-director/angel-left.webp" alt="" />
      <img class="hd-angel-right" src="assets/images/heart-director/angel-right.webp" alt="" />

      <button type="button" class="hd-tunnel-btn" aria-label="Enter the tunnel">
        <img class="hd-tunnel-btn-bg" src="assets/images/heart-director/tunnel-button-bg.webp" alt="" />
        <img class="hd-tunnel-btn-label" src="assets/images/heart-director/button-label.png" alt="" />
      </button>
    </section>

    <!-- Next sections (section-2, section-3, ...) get appended here as they're designed in Figma -->

  </main>

  <script src="script.js"></script>
</body>
</html>

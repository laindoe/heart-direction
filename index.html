<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Direction World</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="scrolly">

    <!-- Section 1: iPhone 17 - 1 (Figma node 1003:3) -->
    <section id="section-1" class="frame-section">
      <div class="frame-visuals" aria-hidden="true">

        <div class="bg-sky">
          <img src="assets/images/sky-stars-bg.jpg" alt="" />
        </div>

        <div class="cloud-layer cloud-1">
          <div class="cloud-crop">
            <img src="assets/images/cloud-layer.webp" alt="" />
          </div>
        </div>

        <div class="cloud-mirror-wrap cloud-2-wrap">
          <div class="cloud-mirror-inner">
            <div class="cloud-layer">
              <div class="cloud-crop">
                <img src="assets/images/cloud-layer.webp" alt="" />
              </div>
            </div>
          </div>
        </div>

        <div class="cloud-layer cloud-3">
          <div class="cloud-crop">
            <img src="assets/images/cloud-layer.webp" alt="" />
          </div>
        </div>

        <div class="cloud-mirror-wrap cloud-4-wrap cloud-anim">
          <div class="cloud-mirror-inner">
            <div class="cloud-layer">
              <div class="cloud-crop">
                <img src="assets/images/cloud-layer.webp" alt="" />
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- Next sections (section-2, section-3, ...) get appended here as they're designed in Figma -->

  </main>

  <script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b0a1d4"><title>Heart Direction</title>
<link rel="stylesheet" href="styles.css"><script type="module" src="script.js?v=tunnel-depth-3"></script>
</head>
<body data-state="exterior">
<div id="environment" aria-hidden="true">
 <picture class="sky">
  <source media="(orientation: landscape)" srcset="assets/images/heart-direction-rebuild/scene-01-background/airbrushed-cyan-sky-desktop.webp" type="image/webp">
  <img src="assets/images/heart-direction-rebuild/scene-01-background/airbrushed-cyan-sky-mobile.webp" alt="" fetchpriority="high" decoding="async">
 </picture>
 <div class="water"></div>
 <img id="portal-fallback" src="assets/images/heart-direction-rebuild/exterior/portal-v002-cutout.png" alt="" decoding="async">
</div>
<canvas id="ship-view" aria-label="Spaceship and exterior environment"></canvas>
<header><h1>HEART DIRECTION</h1><span>ASSEMBLY PREVIEW · <span id="state-label">EXTERIOR</span></span></header>
<main>
 <section id="exterior" aria-label="Exterior invitation">
  <button id="board-ship" type="button" aria-label="Board spaceship" title="GET IN"></button>
  <div id="ship-fallback" hidden>SPACESHIP PLACEHOLDER<br><small>3D preview unavailable; dashboard controls remain available.</small></div>
  <div class="invitation"><p id="load-status" role="status">Loading spaceship…</p><button id="get-in" aria-label="GET IN">GET IN</button><p><span id="exterior-assets-status">Loading scenery…</span></p></div>
 </section>
</main>
<aside id="dashboard" aria-label="Cockpit dashboard" hidden>
 <button id="heart-home" class="art-control" type="button" aria-label="Home" title="Home"><span>Home</span></button>
 <div id="dashboard-screen" role="region" aria-label="Dashboard display" tabindex="0">
  <h2 id="dashboard-title" tabindex="-1">WELCOME TO HEART DIRECTION</h2>
  <div id="screen-content"><p>Journey through Lain Doe Love’s heart, mind, and body of work.</p></div>
 </div>
 <nav aria-label="Destinations">
  <button class="art-control" data-content="Saturn" aria-controls="dashboard-screen" aria-pressed="false"><span>SATURN</span></button>
  <button class="art-control" data-content="Moon" aria-controls="dashboard-screen" aria-pressed="false"><span>MOON</span></button>
  <button class="art-control" data-content="Store" aria-controls="dashboard-screen" aria-pressed="false"><span>STORE</span></button>
  <button class="art-control" data-content="Socials" aria-controls="dashboard-screen" aria-pressed="false"><span>SOCIALS</span></button>
 </nav>
 <span id="screen-announcement" class="sr-only" role="status" aria-live="polite"></span>
</aside>
<noscript><p class="no-script">JavaScript is required for this interactive graybox. The dashboard provides Saturn and Moon coming-soon panels, a digital-download store, and social destinations.</p></noscript>
</body></html>

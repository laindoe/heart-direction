<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Direction World</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="scrolly">

    <!-- Section 1: heart-director-2 (Figma node 1098:2), illustrated hero intro -->
    <section id="section-1" class="section-frame">
      <div class="hero-section hero-illustrated">
        <h1 class="visually-hidden">
          Introducing Laindoe Love — The Heart Director. Revealing the invisible.
        </h1>

        <img class="hd2-bg" src="assets/images/heart-director-2/bg-blue.webp" alt="" />
        <img class="hd2-clouds-left" src="assets/images/heart-director-2/clouds-left.webp" alt="" />
        <img class="hd2-clouds-right" src="assets/images/heart-director-2/clouds-right.webp" alt="" />
        <img class="hd2-tunnel" src="assets/images/heart-director-2/heart-tunnel.webp" alt="" />
        <img class="hd2-title" src="assets/images/heart-director-2/title.webp" alt="" />
        <img class="hd2-ribbon-introducing" src="assets/images/heart-director-2/ribbon-introducing.webp" alt="" />
        <img class="hd2-ribbon-revealing" src="assets/images/heart-director-2/ribbon-revealing.webp" alt="" />
        <img class="hd2-cherub-left" src="assets/images/heart-director-2/cherub.webp" alt="" />
        <img class="hd2-cherub-right" src="assets/images/heart-director-2/cherub.webp" alt="" />
        <img class="hd2-sacred-heart" src="assets/images/heart-director-2/sacred-heart.webp" alt="" />
        <img class="hd2-star hd2-star-1" src="assets/images/heart-director-2/star.webp" alt="" />
        <img class="hd2-star hd2-star-2" src="assets/images/heart-director-2/star.webp" alt="" />
        <img class="hd2-star hd2-star-3" src="assets/images/heart-director-2/star.webp" alt="" />

        <button type="button" class="hd2-marquee-btn">
          <img class="hd2-marquee-bg" src="assets/images/heart-director-2/marquee-board.webp" alt="" />
          <span class="hd2-marquee-label">Enter the Tunnel</span>
        </button>
      </div>
    </section>

    <!-- Section 2: heart-director-page2 (Figma node 1102:2) -->
    <!-- Static for now; will later be revealed via a scroll-driven animation where
         section-1's heart tunnel expands as if the viewer travels through it. -->
    <section id="section-2" class="section-frame section-frame-2">
      <div class="hero-section hero-section-2">
        <h1 class="visually-hidden">Meet Lain Doe Love. Tap the heart to peek inside.</h1>

        <img class="hd3-portrait" src="assets/images/heart-director-page2/portrait.webp" alt="" />
        <img class="hd3-clouds-upper" src="assets/images/heart-director-page2/clouds-upper.webp" alt="" />
        <img class="hd3-banner" src="assets/images/heart-director-page2/banner.webp" alt="" />
        <img class="hd3-dove-left" src="assets/images/heart-director-page2/dove-left.webp" alt="" />
        <img class="hd3-dove-right" src="assets/images/heart-director-page2/dove-right.webp" alt="" />
        <img class="hd3-clouds-lower" src="assets/images/heart-director-page2/clouds-lower.webp" alt="" />

        <div class="hd3-bow-crop">
          <img class="hd3-bow" src="assets/images/heart-director-page2/bow.webp" alt="" />
        </div>

        <img class="hd3-arrow" src="assets/images/heart-director-page2/arrow.webp" alt="" />
      </div>
    </section>

    <!-- Section 3: heart-director-page3 (Figma node 1103:2179) -->
    <!-- Static for now; scroll animation will pull the bow back, enlarge the
         arrow, and light up each target in sequence as it travels downward. -->
    <section id="section-3" class="section-frame section-frame-3">
      <div class="hero-section hero-section-3">
        <h1 class="visually-hidden">
          The Heart Director's arrow passes through three targets on its way down.
        </h1>

        <img class="hd4-arrow" src="assets/images/heart-director-page3/arrow.webp" alt="" />
        <img class="hd4-clouds" src="assets/images/heart-director-page3/clouds.webp" alt="" />

        <div class="hd4-target hd4-target-1">
          <img class="hd4-target-sprite" src="assets/images/heart-director-page3/targets-sprite.webp" alt="" />
        </div>
        <div class="hd4-target hd4-target-2">
          <img class="hd4-target-sprite" src="assets/images/heart-director-page3/targets-sprite.webp" alt="" />
        </div>
        <div class="hd4-target hd4-target-3">
          <img class="hd4-target-sprite" src="assets/images/heart-director-page3/targets-sprite.webp" alt="" />
        </div>
      </div>
    </section>

    <!-- Section 4: heart-director-page4 (Figma node 1104:2231) -->
    <!-- Static for now. Planned animation: the arrow continues down and strikes
         the heart, which then pulsates with light. "The Quest" button opens a
         modal telling this part of the story. "Back to Reality" is the exit —
         the heart tunnel expands as if traveling back out into daytime. -->
    <section id="section-4" class="section-frame section-frame-3">
      <div class="hero-section hero-section-3">
        <h1 class="visually-hidden">
          The arrow strikes the heart. Open the quest, or head back to reality.
        </h1>

        <img class="hd5-clouds" src="assets/images/heart-director-page4/clouds.webp" alt="" />
        <img class="hd5-arrow" src="assets/images/heart-director-page4/arrow.webp" alt="" />

        <button type="button" class="hd5-quest-btn" aria-label="The Quest">
          <img class="hd5-quest-heart" src="assets/images/heart-director-page4/heart-quest.webp" alt="" />
        </button>

        <button type="button" class="hd5-ticket-btn" aria-label="Back to Reality">
          <div class="hd5-ticket-crop">
            <img class="hd5-ticket-texture" src="assets/images/heart-director-page4/ticket-texture.webp" alt="" />
          </div>
        </button>

        <div class="hd5-tunnel-return-crop">
          <img class="hd5-tunnel-return" src="assets/images/heart-director-page4/heart-tunnel-return.webp" alt="" />
        </div>
      </div>
    </section>

    <!-- Next sections (section-5, section-6, ...) get appended here as they're designed in Figma -->

  </main>

  <script src="script.js"></script>
</body>
</html>

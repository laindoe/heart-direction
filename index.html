<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Heart Direction</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene" aria-labelledby="scene-title">
      <h1 id="scene-title" class="visually-hidden">Heart Direction</h1>

      <picture class="scene__layer scene__sky" aria-hidden="true">
        <source
          media="(min-width: 900px) and (orientation: landscape)"
          srcset="assets/images/heart-direction-rebuild/scene-01-background/sky-base-desktop.png"
        />
        <img
          src="assets/images/heart-direction-rebuild/scene-01-background/sky-base-mobile.png"
          alt=""
          fetchpriority="high"
          decoding="async"
        />
      </picture>

      <picture class="scene__layer scene__cloud scene__cloud--left" aria-hidden="true">
        <source
          media="(min-width: 900px) and (orientation: landscape)"
          srcset="assets/images/heart-direction-rebuild/scene-01-background/cloud-left-desktop.png"
        />
        <img
          src="assets/images/heart-direction-rebuild/scene-01-background/cloud-left-mobile.png"
          alt=""
          decoding="async"
        />
      </picture>

      <picture class="scene__layer scene__cloud scene__cloud--right" aria-hidden="true">
        <source
          media="(min-width: 900px) and (orientation: landscape)"
          srcset="assets/images/heart-direction-rebuild/scene-01-background/cloud-right-desktop.png"
        />
        <img
          src="assets/images/heart-direction-rebuild/scene-01-background/cloud-right-mobile.png"
          alt=""
          decoding="async"
        />
      </picture>

      <picture class="scene__layer scene__cloud scene__cloud--foreground" aria-hidden="true">
        <source
          media="(min-width: 900px) and (orientation: landscape)"
          srcset="assets/images/heart-direction-rebuild/scene-01-background/cloud-foreground-desktop.png"
        />
        <img
          src="assets/images/heart-direction-rebuild/scene-01-background/cloud-foreground-mobile.png"
          alt=""
          decoding="async"
        />
      </picture>
    </main>
  </body>
</html>
